<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xarajat Trekeri — Statistika bilan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b1020; --card: rgba(255,255,255,.05); --card-b: rgba(255,255,255,.09);
    --txt: #eaf0ff; --muted: #8b95b5; --green: #2ee6a8; --red: #ff6b81;
    --accent: #6c8cff; --gold: #ffd93d;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    background: var(--bg); color: var(--txt); min-height: 100vh;
    padding: clamp(12px, 3vw, 28px); overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .35;
    pointer-events: none; z-index: 0; animation: float 18s ease-in-out infinite; }
  .orb.a { width: 380px; height: 380px; background: #6c5ce7; top: -120px; left: -100px; }
  .orb.b { width: 320px; height: 320px; background: #00b894; bottom: -100px; right: -80px; animation-delay: -6s; }
  .orb.c { width: 260px; height: 260px; background: #ff6b81; top: 45%; left: 55%; animation-delay: -12s; opacity: .22; }
  @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(40px,-30px) scale(1.08); } 66% { transform: translate(-30px,25px) scale(.94); } }
  .app { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto;
    display: flex; flex-direction: column; gap: clamp(14px, 2vw, 20px);
    animation: fadeUp .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: clamp(17px, 2.4vw, 21px); font-weight: 700; letter-spacing: -.4px; display: flex; align-items: center; gap: 8px; }
  .logo span { background: linear-gradient(90deg, #fff, #9fb0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rate-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,217,61,.12); border: 1px solid rgba(255,217,61,.3);
    color: var(--gold); padding: 7px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 700; transition: .3s;
  }
  .rate-badge.loading { opacity: .6; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
  .reset-btn {
    background: rgba(255,107,129,.12); border: 1px solid rgba(255,107,129,.3);
    color: var(--red); padding: 8px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: .25s; font-family: inherit;
  }
  .reset-btn:hover { background: rgba(255,107,129,.22); transform: translateY(-1px); }
  .card {
    background: var(--card); border: 1px solid var(--card-b);
    border-radius: 20px; padding: clamp(16px, 2.4vw, 22px);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .card h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 16px; }
  .balance-card {
    background: linear-gradient(135deg, rgba(108,140,255,.16), rgba(46,230,168,.10));
    border: 1px solid rgba(255,255,255,.12); border-radius: 22px;
    padding: clamp(18px, 3vw, 28px); position: relative; overflow: hidden;
    animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .balance-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%);
    transform: translateX(-100%); animation: shimmer 4.5s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .bc-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); font-weight: 600; }
  .bc-value { font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: -1.5px; margin: 6px 0 18px; line-height: 1.15; transition: color .3s; }
  .bc-value small { font-size: .38em; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
  .bc-row { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
  .bc-item { flex: 1 1 130px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 10px 14px; transition: .25s; }
  .bc-item:hover { background: rgba(255,255,255,.09); transform: translateY(-2px); }
  .bc-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; font-size: 15px; font-weight: 800; flex-shrink: 0; }
  .bc-item.income .bc-icon { background: rgba(46,230,168,.16); color: var(--green); }
  .bc-item.expense .bc-icon { background: rgba(255,107,129,.16); color: var(--red); }
  .bc-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
  .bc-num { font-size: clamp(14px, 2vw, 17px); font-weight: 700; margin-top: 1px; }
  .bc-item.income .bc-num { color: var(--green); }
  .bc-item.expense .bc-num { color: var(--red); }
  .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(14px,2vw,20px); align-items: start; }
  .type-switch { display: flex; gap: 6px; background: rgba(0,0,0,.25); padding: 5px; border-radius: 13px; margin-bottom: 16px; }
  .ts-btn { flex: 1; padding: 10px; border: none; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13.5px; font-weight: 700; cursor: pointer; transition: .25s; font-family: inherit; }
  .ts-btn.active[data-type="expense"] { background: rgba(255,107,129,.18); color: var(--red); box-shadow: 0 4px 14px -6px var(--red); }
  .ts-btn.active[data-type="income"] { background: rgba(46,230,168,.18); color: var(--green); box-shadow: 0 4px 14px -6px var(--green); }
  .currency-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .currency-switch { display: flex; background: rgba(0,0,0,.3); border-radius: 10px; padding: 3px; gap: 3px; }
  .curr-btn { border: none; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: .22s; }
  .curr-btn.active { background: rgba(108,140,255,.25); color: #b9c6ff; }
  .currency-hint { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  form { display: flex; flex-direction: column; gap: 7px; }
  form label, .modal label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .9px; color: var(--muted); font-weight: 700; margin-top: 6px; }
  form input, .modal input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--card-b);
    background: rgba(0,0,0,.25); color: var(--txt); font-size: 15px; font-family: inherit;
    outline: none; transition: .25s;
  }
  form input:focus, .modal input:focus { border-color: var(--accent); background: rgba(108,140,255,.08); box-shadow: 0 0 0 4px rgba(108,140,255,.12); }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 7px; margin-bottom: 4px; }
  .cat {
    display: flex; align-items: center; gap: 6px; padding: 9px 10px;
    border-radius: 11px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
    color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: .22s cubic-bezier(.2,.8,.2,1); font-family: inherit; overflow: hidden; white-space: nowrap;
  }
  .cat.active { background: var(--c); color: #0b1020; border-color: transparent; box-shadow: 0 8px 20px -10px var(--c); }
  .submit-btn {
    margin-top: 16px; padding: 14px; border: none; border-radius: 13px;
    background: linear-gradient(135deg, #6c8cff, #8f6cff); color: #fff;
    font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    transition: .25s; box-shadow: 0 10px 26px -12px #6c8cff;
  }
  .submit-btn:hover { transform: translateY(-2px); }
  .stats-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .stats-head h2 { margin: 0; }
  .mini-switch { display: flex; gap: 4px; background: rgba(0,0,0,.25); padding: 3px; border-radius: 9px; }
  .mini-switch button { border: none; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-family: inherit; transition: .22s; }
  .mini-switch button.active { background: rgba(255,255,255,.1); color: #fff; }
  .year-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .year-btn { border: 1px solid var(--card-b); background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: .22s; }
  .year-btn:hover { color: #fff; border-color: rgba(255,255,255,.25); }
  .year-btn.active { background: rgba(108,140,255,.2); border-color: rgba(108,140,255,.5); color: #b9c6ff; }
  .month-filter { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .month-btn { border: none; background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 7px; cursor: pointer; font-family: inherit; transition: .18s; }
  .month-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
  .month-btn.active { background: rgba(108,140,255,.22); color: #b9c6ff; }
  .month-btn.has-data { color: var(--txt); }
  .month-btn.has-data::after { content: '·'; color: var(--green); margin-left: 2px; }
  .stats-list { display: flex; flex-direction: column; gap: 13px; }
  .stat-row { animation: fadeUp .45s both; }
  .stat-top { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
  .stat-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .stat-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-amt { font-weight: 700; font-size: 12.5px; color: #cfd8ff; }
  .stat-pct { font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }
  .bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .85s cubic-bezier(.2,.8,.2,1); }
  .empty-mini { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 0; line-height: 1.6; }

  /* --- OYLIK STATISTIKA --- */
  .ov-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ov-sum-item { flex: 1 1 130px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 10px 14px; }
  .ov-sum-label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  .ov-sum-value { font-size: clamp(14px, 2vw, 16px); font-weight: 700; margin-top: 3px; display: block; }
  .ov-sum-item.income .ov-sum-value { color: var(--green); }
  .ov-sum-item.expense .ov-sum-value { color: var(--red); }
  .ov-sum-item.balance .ov-sum-value.pos { color: var(--green); }
  .ov-sum-item.balance .ov-sum-value.neg { color: var(--red); }
  .ov-months { display: flex; flex-direction: column; gap: 14px; }
  .ov-month { animation: fadeUp .45s both; }
  .ov-month-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ov-month-name { font-size: 13px; font-weight: 700; }
  .ov-month-net { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .ov-month-net.pos { background: rgba(46,230,168,.14); color: var(--green); }
  .ov-month-net.neg { background: rgba(255,107,129,.14); color: var(--red); }
  .ov-line { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .ov-line-icon { width: 18px; height: 18px; border-radius: 5px; font-size: 11px; font-weight: 800; display: grid; place-items: center; flex-shrink: 0; }
  .ov-line-icon.income { background: rgba(46,230,168,.16); color: var(--green); }
  .ov-line-icon.expense { background: rgba(255,107,129,.16); color: var(--red); }
  .ov-track { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; }
  .ov-fill { height: 100%; width: 0; border-radius: 99px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .ov-fill.income { background: var(--green); }
  .ov-fill.expense { background: var(--red); }
  .ov-line-val { font-size: 11.5px; font-weight: 700; min-width: 84px; text-align: right; }
  .ov-line-val.income { color: var(--green); }
  .ov-line-val.expense { color: var(--red); }

  /* --- RO'YXAT --- */
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .list-head h2 { margin: 0; }
  .filters { display: flex; gap: 6px; }
  .filter { border: 1px solid var(--card-b); background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 99px; cursor: pointer; font-family: inherit; transition: .22s; }
  .filter.active { background: rgba(108,140,255,.18); border-color: rgba(108,140,255,.5); color: #b9c6ff; }
  .tx-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .tx {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06);
    animation: slideIn .42s cubic-bezier(.2,.8,.2,1) both;
    transition: transform .22s, background .22s, border-color .22s;
    cursor: pointer; position: relative;
  }
  .tx:hover { transform: translateX(4px); background: rgba(255,255,255,.075); border-color: rgba(255,255,255,.14); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .tx.removing { animation: slideOut .32s forwards; pointer-events: none; }
  @keyframes slideOut { to { opacity: 0; transform: translateX(60px) scale(.9); height: 0; padding: 0; margin: 0; border-width: 0; } }
  .tx-icon { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
  .tx-body { flex: 1; min-width: 0; }
  .tx-name { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-amount { font-size: 14.5px; font-weight: 750; white-space: nowrap; }
  .tx-amount.income { color: var(--green); }
  .tx-amount.expense { color: var(--red); }
  .tx-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .action-btn {
    width: 30px; height: 30px; border-radius: 9px; border: none; background: transparent;
    color: #5d6788; font-size: 14px; cursor: pointer; display: grid; place-items: center;
    transition: .22s; font-family: inherit; opacity: 0;
  }
  .tx:hover .action-btn { opacity: 1; }
  .action-btn.edit-btn:hover { background: rgba(108,140,255,.18); color: var(--accent); }
  .action-btn.del-btn:hover { background: rgba(255,107,129,.16); color: var(--red); }
  .empty { text-align: center; padding: 44px 20px; color: var(--muted); animation: fadeUp .5s both; }
  .empty .em { font-size: 40px; display: block; margin-bottom: 12px; opacity: .6; }

  /* --- MODAL --- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.72);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    padding: 16px; animation: fadeIn .22s ease;
  }
  .modal-overlay.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #121a30; border: 1px solid var(--card-b); border-radius: 20px;
    width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto;
    animation: modalIn .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .modal-header h3 { font-size: 15px; font-weight: 700; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 9px; border: none; background: transparent;
    color: var(--muted); font-size: 16px; cursor: pointer; transition: .2s; font-family: inherit;
  }
  .modal-close:hover { background: rgba(255,255,255,.08); color: #fff; }
  .modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 4px; }
  .modal-body .type-switch { margin-bottom: 8px; }
  .modal-body .currency-switch { margin-bottom: 4px; }
  .modal-footer {
    display: flex; gap: 8px; padding: 16px 22px 22px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .modal-footer button {
    flex: 1; min-width: 100px; padding: 11px; border-radius: 11px; border: none;
    font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; transition: .22s;
  }
  .btn-primary { background: linear-gradient(135deg, #6c8cff, #8f6cff); color: #fff; box-shadow: 0 8px 20px -10px #6c8cff; }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-secondary { background: rgba(255,255,255,.07); color: var(--txt); }
  .btn-secondary:hover { background: rgba(255,255,255,.12); }
  .btn-danger { background: rgba(255,107,129,.14); color: var(--red); border: 1px solid rgba(255,107,129,.3); }
  .btn-danger:hover { background: rgba(255,107,129,.24); }

  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 520px) {
    .cats { grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); }
    .action-btn { opacity: 1; }
    .tx:hover { transform: none; }
    .bc-item { flex: 1 1 100%; }
    .list-head { flex-direction: column; align-items: stretch; }
    .filters { justify-content: center; }
    .filter { flex: 1; }
    .ov-line-val { min-width: 70px; font-size: 11px; }
    .modal-footer button { flex: 1 1 100%; }
    .modal-footer .btn-danger { order: 3; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<div class="app">
  <div class="topbar">
    <div class="logo">💸 <span>Xarajat Trekeri</span></div>
    <div class="rate-badge loading" id="rateBadge">1 USD = ... so'm</div>
    <button class="reset-btn" id="resetBtn">Hammasini tozalash</button>
  </div>

  <div class="balance-card">
    <div class="bc-label">Umumiy balans (so'mda)</div>
    <div class="bc-value"><span id="balanceNum">0</span><small>so'm</small></div>
    <div class="bc-row">
      <div class="bc-item income">
        <div class="bc-icon">↓</div>
        <div><div class="bc-sub">Kirim</div><div class="bc-num"><span id="incomeNum">0</span> so'm</div></div>
      </div>
      <div class="bc-item expense">
        <div class="bc-icon">↑</div>
        <div><div class="bc-sub">Chiqim</div><div class="bc-num"><span id="expenseNum">0</span> so'm</div></div>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Yangi amal</h2>
      <div class="type-switch" id="mainTypeSwitch">
        <button class="ts-btn active" data-type="expense">Chiqim</button>
        <button class="ts-btn" data-type="income">Kirim</button>
      </div>
      <form id="form">
        <label>Valyuta</label>
        <div class="currency-row">
          <div class="currency-switch" id="mainCurrencySwitch">
            <button type="button" class="curr-btn active" data-currency="UZS">so'm</button>
            <button type="button" class="curr-btn" data-currency="USD">$ USD</button>
          </div>
          <span class="currency-hint" id="currencyHint"></span>
        </div>
        <label for="amount">Summa</label>
        <input type="text" id="amount" inputmode="decimal" autocomplete="off" placeholder="0" required>
        <label>Kategoriya</label>
        <div class="cats" id="cats"></div>
        <label for="note">Izoh (ixtiyoriy)</label>
        <input type="text" id="note" placeholder="Masalan: tushlik" maxlength="50">
        <button type="submit" class="submit-btn">Qo'shish</button>
      </form>
    </div>

    <div class="card">
      <div class="stats-head">
        <h2>Kategoriyalar</h2>
        <div class="mini-switch" id="statsTypeSwitch">
          <button class="active" data-stats="expense">Chiqim</button>
          <button data-stats="income">Kirim</button>
        </div>
      </div>
      <div class="year-tabs" id="yearTabs"></div>
      <div class="month-filter" id="monthFilter"></div>
      <div class="stats-list" id="stats"></div>
    </div>
  </div>

  <!-- OYLIK STATISTIKA -->
  <div class="card">
    <div class="stats-head">

<script>
/* ============ KATEGORIYALAR ============ */
const CATEGORIES = {
  expense: [
    { id: 'food',      name: 'Oziq-ovqat',      icon: '🍔', color: '#ff7675' },
    { id: 'transport', name: 'Transport',        icon: '🚕', color: '#74b9ff' },
    { id: 'housing',   name: 'Uy-joy',           icon: '🏠', color: '#a29bfe' },
    { id: 'clothes',   name: 'Kiyim-kechak',     icon: '👕', color: '#fd79a8' },
    { id: 'health',    name: "Sog'liq",          icon: '💊', color: '#55efc4' },
    { id: 'fun',       name: "Ko'ngilxushlik",   icon: '🎮', color: '#ffeaa7' },
    { id: 'study',     name: "Ta'lim",           icon: '📚', color: '#81ecec' },
    { id: 'other_ex',  name: 'Boshqa',           icon: '📦', color: '#b2bec3' }
  ],
  income: [
    { id: 'salary',    name: 'Ish haqi',         icon: '💼', color: '#00b894' },
    { id: 'business',  name: 'Biznes',           icon: '📈', color: '#00cec9' },
    { id: 'gift',      name: "Sovg'a",           icon: '🎁', color: '#fdcb6e' },
    { id: 'other_in',  name: 'Boshqa',           icon: '💰', color: '#55efc4' }
  ]
};

const MONTH_SHORT = ['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
const MONTH_FULL  = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];

/* ============ HOLAT ============ */
let transactions = [];
try {
  transactions = JSON.parse(localStorage.getItem('xarajat_tx_v3') || '[]');
  if (!Array.isArray(transactions)) transactions = [];
} catch (e) { transactions = []; }

let currentType     = 'expense';
let currentCat      = 'food';
let currentFilter   = 'all';
let statsType       = 'expense';
let currentCurrency = 'UZS';
let usdRate         = 12500;

// Statistika davri
let statsYear   = new Date().getFullYear();
let statsMonth  = null; // null = yillik

// Tahrirlash holati
let editTxId    = null;
let editType    = 'expense';
let editCat     = 'food';
let editCurrency = 'UZS';

const $ = id => document.getElementById(id);

function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtUSD(n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function catById(type, id) { return (CATEGORIES[type] || []).find(c => c.id === id) || { name: 'Boshqa', icon: '📦', color: '#b2bec3' }; }
function dateStr(ts) {
  const d = new Date(ts); const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}
function toUZS(amount, currency) { return currency === 'USD' ? amount * usdRate : amount; }
function save() { try { localStorage.setItem('xarajat_tx_v3', JSON.stringify(transactions)); } catch (e) {} }

/* ============ SUMMANI FORMATLASH ============ */
function formatAmountFor(raw, currency) {
  const isUSD = currency === 'USD';
  let cleaned = raw.replace(isUSD ? /[^\d.]/g : /[^\d]/g, '');
  if (isUSD) {
    const firstDot = cleaned.indexOf('.');
    if (firstDot >= 0) {
      const before = cleaned.slice(0, firstDot);
      const after  = cleaned.slice(firstDot + 1).replace(/\./g, '').slice(0, 2);
      cleaned = before + '.' + after;
    }
  }
  const dotIdx = cleaned.indexOf('.');
  let intPart  = dotIdx >= 0 ? cleaned.slice(0, dotIdx) : cleaned;
  const decPart = dotIdx >= 0 ? cleaned.slice(dotIdx) : '';
  intPart = intPart.replace(/^0+(?=\d)/, '');
  if (intPart) intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return intPart + decPart;
}

function attachAmountHandler(inputEl, currencyGetter) {
  let prevValue = '';
  inputEl.addEventListener('input', e => {
    const input = e.target;
    let value  = input.value;
    let cursor = input.selectionStart ?? value.length;

    if (e.inputType === 'deleteContentBackward'
        && prevValue
        && prevValue.length - value.length === 1
        && cursor < prevValue.length
        && prevValue[cursor] === ' ') {
      value  = value.slice(0, Math.max(0, cursor - 1)) + value.slice(cursor);
      cursor = Math.max(0, cursor - 1);
    }

    let digitsBefore = 0;
    let dotBefore = false;
    for (let i = 0; i < cursor && i < value.length; i++) {
      if (/\d/.test(value[i])) digitsBefore++;
      else if (value[i] === '.') dotBefore = true;
    }

    const formatted = formatAmountFor(value, currencyGetter());
    input.value = formatted;
    prevValue = formatted;

    let newCursor = 0;
    if (digitsBefore === 0) {
      if (dotBefore) {
        const di = formatted.indexOf('.');
        newCursor = di >= 0 ? di + 1 : 0;
      }
    } else {
      let seen = 0;
      for (let i = 0; i < formatted.length; i++) {
        if (/\d/.test(formatted[i])) {
          seen++;
          if (seen === digitsBefore) { newCursor = i + 1; break; }
        }
      }
      if (dotBefore && formatted[newCursor] === '.') newCursor++;
    }
    input.setSelectionRange(newCursor, newCursor);
  });

  return {
    reset() { prevValue = ''; inputEl.value = ''; },
    setValue(v) { inputEl.value = v; prevValue = v; },
    getPrev() { return prevValue; }
  };
}

const mainAmountHandler = attachAmountHandler($('amount'), () => currentCurrency);
const editAmountHandler = attachAmountHandler($('editAmount'), () => editCurrency);

/* ============ CBU KURSI ============ */
async function fetchUsdRate() {
  const badge = $('rateBadge');
  badge.classList.add('loading');
  try {
    const res = await fetch('https://cbu.uz/ru/arkhiv-kursov-valyut/json/', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const usd  = data.find(item => item.Ccy === 'USD');
    if (usd && usd.Rate) {
      const rate = parseFloat(usd.Rate) / (parseFloat(usd.Nominal) || 1);
      if (isFinite(rate) && rate > 0) {
        usdRate = rate;
        badge.textContent = `1 USD = ${fmt(rate)} so'm (CBU)`;
        badge.classList.remove('loading');
        render();
        return;
      }
    }
    throw new Error('USD topilmadi');
  } catch (e) {
    badge.textContent = `1 USD ≈ ${fmt(usdRate)} so'm (zaxira)`;
    badge.classList.remove('loading');
    console.warn('CBU kursini olishda xatolik:', e);
  }
}

/* ============ RAQAM ANIMATSIYASI ============ */
const counters = {};
function animateNum(el, key, to) {
  const from = counters[key] ?? 0; counters[key] = to;
  if (from === to) { el.textContent = fmt(to); return; }
  const dur = 620, start = performance.now();
  function step(t) {
    const p = Math.min((t - start) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============ KATEGORIYA CHIPLARI ============ */
function renderCats() {
  const wrap = $('cats');
  const list = CATEGORIES[currentType];
  if (!list.some(c => c.id === currentCat)) currentCat = list[0].id;
  wrap.innerHTML = '';
  list.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat' + (c.id === currentCat ? ' active' : '');
    b.style.setProperty('--c', c.color);
    b.innerHTML = `<span>${c.icon}</span><span>${c.name}</span>`;
    b.addEventListener('click', () => { currentCat = c.id; renderCats(); });
    wrap.appendChild(b);
  });
}

function renderEditCats() {
  const wrap = $('editCats');
  const list = CATEGORIES[editType];
  if (!list.some(c => c.id === editCat)) editCat = list[0].id;
  wrap.innerHTML = '';
  list.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat' + (c.id === editCat ? ' active' : '');
    b.style.setProperty('--c', c.color);
    b.innerHTML = `<span>${c.icon}</span><span>${c.name}</span>`;
    b.addEventListener('click', () => { editCat = c.id; renderEditCats(); });
    wrap.appendChild(b);
  });
}

/* ============ TOTALLAR ============ */
function renderTotals() {
  let income = 0, expense = 0;
  transactions.forEach(t => {
    const uzs = toUZS(t.amount, t.currency || 'UZS');
    if (t.type === 'income') income += uzs; else expense += uzs;
  });
  animateNum($('incomeNum'),  'income',  income);
  animateNum($('expenseNum'), 'expense', expense);
  animateNum($('balanceNum'), 'balance', income - expense);
  const bal = income - expense;
  $('balanceNum').style.color = bal > 0 ? 'var(--green)' : bal < 0 ? 'var(--red)' : 'var(--txt)';
}

/* ============ YIL TABLARI ============ */
function getAvailableYears() {
  const years = new Set([new Date().getFullYear()]);
  transactions.forEach(t => years.add(new Date(t.ts).getFullYear()));
  return Array.from(years).sort((a, b) => b - a);
}

function renderYearTabs() {
  const wrap = $('yearTabs');
  const years = getAvailableYears();
  if (!years.includes(statsYear)) statsYear = years[0];
  wrap.innerHTML = '';
  years.forEach(y => {
    const b = document.createElement('button');
    b.className = 'year-btn' + (y === statsYear ? ' active' : '');
    b.textContent = y;
    b.addEventListener('click', () => {
      statsYear = y;
      statsMonth = null;
      renderStats();
      renderMonthlyOverview();
      renderYearTabs();
    });
    wrap.appendChild(b);
  });
  $('ovYearLabel').textContent = '— ' + statsYear;
}

/* ============ OY FILTRI ============ */
function renderMonthFilter() {
  const wrap = $('monthFilter');
  wrap.innerHTML = '';

  // Yillik
  const yillik = document.createElement('button');
  yillik.className = 'month-btn' + (statsMonth === null ? ' active' : '');
  yillik.textContent = 'Yillik';
  yillik.addEventListener('click', () => { statsMonth = null; renderStats(); renderMonthFilter(); });
  wrap.appendChild(yillik);

  // Qaysi oylarda data bor
  const monthsWithData = new Set();
  transactions.forEach(t => {
    const d = new Date(t.ts);
    if (d.getFullYear() === statsYear && t.type === statsType) monthsWithData.add(d.getMonth());
  });

  MONTH_SHORT.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'month-btn'
      + (statsMonth === i ? ' active' : '')
      + (monthsWithData.has(i) ? ' has-data' : '');
    b.textContent = name;
    b.addEventListener('click', () => {
      statsMonth = (statsMonth === i) ? null : i;
      renderStats();
      renderMonthFilter();
    });
    wrap.appendChild(b);
  });
}

/* ============ STATISTIKA (kategoriyalar) ============ */
function renderStats() {
  const wrap = $('stats');
  const list = transactions.filter(t => {
    if (t.type !== statsType) return false;
    const d = new Date(t.ts);
    if (d.getFullYear() !== statsYear) return false;
    if (statsMonth !== null && d.getMonth() !== statsMonth) return false;
    return true;
  });

  if (!list.length) {
    const period = statsMonth !== null ? `${MONTH_FULL[statsMonth]} ${statsYear}` : `${statsYear} yil`;
    wrap.innerHTML = `<div class="empty-mini">${period} uchun ${statsType === 'expense' ? 'chiqim' : 'kirim'} yo'q</div>`;
    return;
  }

  const groups = {};
  list.forEach(t => {
    const uzs = toUZS(t.amount, t.currency || 'UZS');
    groups[t.category] = (groups[t.category] || 0) + uzs;
  });
  const total = Object.values(groups).reduce((a, b) => a + b, 0);
  const entries = Object.entries(groups).sort((a, b) => b[1] - a[1]);

  wrap.innerHTML = '';
  entries.forEach(([id, amount], i) => {
    const c = catById(statsType, id);
    const pct = total ? (amount / total) * 100 : 0;
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.style.animationDelay = (i * 55) + 'ms';
    row.innerHTML = `
      <div class="stat-top">
        <span class="stat-dot" style="background:${c.color}"></span>
        <span class="stat-name">${c.icon} ${c.name}</span>
        <span class="stat-amt">${fmt(amount)} so'm</span>
        <span class="stat-pct">${Math.round(pct)}%</span>
      </div>
      <div class="bar"><i style="background:${c.color}" data-w="${pct.toFixed(1)}"></i></div>
    `;
    wrap.appendChild(row);
  });
  requestAnimationFrame(() => {
    wrap.querySelectorAll('.bar > i').forEach(el => el.style.width = el.dataset.w + '%');
  });
}

/* ============ OYLIK STATISTIKA (diagramma) ============ */
function renderMonthlyOverview() {
  const sumWrap = $('ovSummary');
  const monthWrap = $('ovMonths');

  // Yil bo'yicha oylik ma'lumot
  const months = Array.from({ length: 12 }, () => ({ income: 0, expense: 0 }));
  transactions.forEach(t => {
    const d = new Date(t.ts);
    if (d.getFullYear() !== statsYear) return;
    const m = d.getMonth();
    const uzs = toUZS(t.amount, t.currency || 'UZS');
    if (t.type === 'income') months[m].income += uzs;
    else months[m].expense += uzs;
  });

  const totalIncome  = months.reduce((s, m) => s + m.income, 0);
  const totalExpense = months.reduce((s, m) => s + m.expense, 0);
  const totalBalance = totalIncome - totalExpense;

  // Yillik jami
  sumWrap.innerHTML = `
    <div class="ov-sum-item income">
      <span class="ov-sum-label">Yillik kirim</span>
      <span class="ov-sum-value">${fmt(totalIncome)} so'm</span>
    </div>
    <div class="ov-sum-item expense">
      <span class="ov-sum-label">Yillik chiqim</span>
      <span class="ov-sum-value">${fmt(totalExpense)} so'm</span>
    </div>
    <div class="ov-sum-item balance">
      <span class="ov-sum-label">Balans</span>
      <span class="ov-sum-value ${totalBalance >= 0 ? 'pos' : 'neg'}">${totalBalance >= 0 ? '+' : '−'}${fmt(Math.abs(totalBalance))} so'm</span>
    </div>
  `;

  // Faqat data bor oylar
  const activeMonths = months
    .map((m, i) => ({ ...m, i }))
    .filter(m => m.income > 0 || m.expense > 0);

  if (!activeMonths.length) {
    monthWrap.innerHTML = `<div class="empty-mini">${statsYear} yil uchun hali ma'lumot yo'q</div>`;
    return;
  }

  const maxVal = Math.max(...activeMonths.map(m => Math.max(m.income, m.expense)), 1);

  monthWrap.innerHTML = '';
  activeMonths.forEach((m, idx) => {
    const net = m.income - m.expense;
    const incomePct  = (m.income  / maxVal) * 100;
    const expensePct = (m.expense / maxVal) * 100;

    const div = document.createElement('div');
    div.className = 'ov-month';
    div.style.animationDelay = (idx * 55) + 'ms';
    div.innerHTML = `
      <div class="ov-month-head">
        <span class="ov-month-name">${MONTH_FULL[m.i]} ${statsYear}</span>
        <span class="ov-month-net ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '+' : '−'}${fmt(Math.abs(net))}</span>
      </div>
      <div class="ov-line">
        <span class="ov-line-icon income">↓</span>
        <div class="ov-track"><div class="ov-fill income" data-w="${incomePct.toFixed(1)}"></div></div>
        <span class="ov-line-val income">${fmt(m.income)}</span>
      </div>
      <div class="ov-line">
        <span class="ov-line-icon expense">↑</span>
        <div class="ov-track"><div class="ov-fill expense" data-w="${expensePct.toFixed(1)}"></div></div>
        <span class="ov-line-val expense">${fmt(m.expense)}</span>
      </div>
    `;
    monthWrap.appendChild(div);
  });

  requestAnimationFrame(() => {
    monthWrap.querySelectorAll('.ov-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  });
}

/* ============ RO'YXAT ============ */
function renderList() {
  const ul = $('list');
  let list = transactions.slice();
  if (currentFilter !== 'all') list = list.filter(t => t.type === currentFilter);
  list.sort((a, b) => b.ts - a.ts);
  if (!list.length) {
    ul.innerHTML = `<div class="empty"><span class="em">🗂️</span><p>Amallar yo'q</p></div>`;
    return;
  }
  ul.innerHTML = '';
  list.forEach((t, i) => {
    const c    = catById(t.type, t.category);
    const curr = t.currency || 'UZS';
    const li   = document.createElement('li');
    li.className = 'tx';
    li.style.animationDelay = Math.min(i * 42, 400) + 'ms';
    li.dataset.id = t.id;
    const amountDisplay = curr === 'USD' ? fmtUSD(t.amount) : fmt(t.amount) + " so'm";
    li.innerHTML = `
      <div class="tx-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
      <div class="tx-body">
        <div class="tx-name">${c.name}</div>
        <div class="tx-meta">${t.note ? escapeHtml(t.note) + ' · ' : ''}${dateStr(t.ts)} · ${curr}</div>
      </div>
      <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '−'}${amountDisplay}</div>
      <div class="tx-actions">
        <button class="action-btn edit-btn" title="Tahrirlash">✏️</button>
        <button class="action-btn del-btn" title="O'chirish">✕</button>
      </div>
    `;
    ul.appendChild(li);
  });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

function render() {
  renderTotals();
  renderYearTabs();
  renderMonthFilter();
  renderStats();
  renderMonthlyOverview();
  renderList();
  save();
}

/* ============ MODAL (TAHRIRLASH) ============ */
function openEditModal(txId) {
  const tx = transactions.find(t => t.id === txId);
  if (!tx) return;

  editTxId     = txId;
  editType     = tx.type;
  editCat      = tx.category;
  editCurrency = tx.currency || 'UZS';

  // Toggle holatlari
  document.querySelectorAll('#editTypeSwitch .ts-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.type === editType);
  });
  document.querySelectorAll('#editCurrencySwitch .curr-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.currency === editCurrency);
  });

  renderEditCats();

  // Summa
  const amountStr = editCurrency === 'USD'
    ? Number(tx.amount).toFixed(2)
    : String(tx.amount);
  editAmountHandler.setValue(formatAmountFor(amountStr, editCurrency));

  // Izoh
  $('editNote').value = tx.note || '';

  $('editModal').classList.add('open');
  setTimeout(() => $('editAmount').focus(), 60);
}

function closeEditModal() {
  $('editModal').classList.remove('open');
  editTxId = null;
}

$('editClose').addEventListener('click', closeEditModal);
$('editCancel').addEventListener('click', closeEditModal);
$('editModal').addEventListener('click', e => { if (e.target === $('editModal')) closeEditModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('editModal').classList.contains('open')) closeEditModal();
});

// Modal tur almashtirish
document.querySelectorAll('#editTypeSwitch .ts-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#editTypeSwitch .ts-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    editType = btn.dataset.type;
    renderEditCats();
  });
});

// Modal valyuta almashtirish
document.querySelectorAll('#editCurrencySwitch .curr-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#editCurrencySwitch .curr-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    editCurrency = btn.dataset.currency;
    const val = $('editAmount').value;
    editAmountHandler.setValue(formatAmountFor(val, editCurrency));
  });
});

// Saqlash
$('editSave').addEventListener('click', () => {
  if (!editTxId) return;
  const tx = transactions.find(t => t.id === editTxId);
  if (!tx) return;

  const raw = $('editAmount').value.replace(/\s/g, '');
  let amount = parseFloat(raw);
  if (!amount || amount <= 0 || !isFinite(amount)) {
    $('editAmount').focus();
    $('editAmount').style.borderColor = 'var(--red)';
    setTimeout(() => $('editAmount').style.borderColor = '', 900);
    return;
  }
  amount = editCurrency === 'UZS' ? Math.round(amount) : Math.round(amount * 100) / 100;

  tx.type     = editType;
  tx.category = editCat;
  tx.currency = editCurrency;
  tx.amount   = amount;
  tx.note     = $('editNote').value.trim();

  closeEditModal();
  render();
});

// Modal orqali o'chirish
$('editDelete').addEventListener('click', () => {
  if (!editTxId) return;
  const id = editTxId;
  closeEditModal();
  removeTransaction(id);
});

function removeTransaction(id) {
  const li = document.querySelector(`.tx[data-id="${id}"]`);
  if (li) li.classList.add('removing');
  setTimeout(() => {
    transactions = transactions.filter(t => t.id !== id);
    render();
  }, 300);
}

/* ============ HODISALAR ============ */
// Asosiy tur
document.querySelectorAll('#mainTypeSwitch .ts-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#mainTypeSwitch .ts-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    renderCats();
    $('amount').focus();
  });
});

// Asosiy valyuta
document.querySelectorAll('#mainCurrencySwitch .curr-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#mainCurrencySwitch .curr-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCurrency = btn.dataset.currency;
    mainAmountHandler.setValue(formatAmountFor($('amount').value, currentCurrency));
    updateCurrencyHint();
  });
});

function updateCurrencyHint() {
  $('currencyHint').textContent = currentCurrency === 'USD' ? `≈ ${fmt(usdRate)} so'm / $1` : '';
}

// Forma
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const amountInput = $('amount');
  const raw = amountInput.value.replace(/\s/g, '');
  let amount = parseFloat(raw);

  if (!amount || amount <= 0 || !isFinite(amount)) {
    amountInput.focus();
    amountInput.style.borderColor = 'var(--red)';
    setTimeout(() => amountInput.style.borderColor = '', 900);
    return;
  }
  amount = currentCurrency === 'UZS' ? Math.round(amount) : Math.round(amount * 100) / 100;

  transactions.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    type: currentType,
    category: currentCat,
    amount: amount,
    currency: currentCurrency,
    note: $('note').value.trim(),
    ts: Date.now()
  });

  $('note').value = '';
  mainAmountHandler.reset();
  amountInput.focus();
  render();
});

// Ro'yxatda klik
$('list').addEventListener('click', e => {
  const delBtn = e.target.closest('.del-btn');
  if (delBtn) {
    e.stopPropagation();
    const li = delBtn.closest('.tx');
    if (li) removeTransaction(li.dataset.id);
    return;
  }
  const editBtn = e.target.closest('.edit-btn');
  if (editBtn) {
    e.stopPropagation();
    const li = editBtn.closest('.tx');
    if (li) openEditModal(li.dataset.id);
    return;
  }
  const li = e.target.closest('.tx');
  if (li) openEditModal(li.dataset.id);
});

// Filtrlar
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

// Statistika turi
document.querySelectorAll('[data-stats]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-stats]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    statsType = btn.dataset.stats;
    renderMonthFilter();
    renderStats();
  });
});

// Tozalash
$('resetBtn').addEventListener('click', () => {
  if (!transactions.length) return;
  if (confirm("Barcha amallarni o'chirmoqchimisiz?")) {
    transactions = [];
    Object.keys(counters).forEach(k => delete counters[k]);
    render();
  }
});

/* ============ ISHGA TUSHIRISH ============ */
renderCats();
updateCurrencyHint();
render();
fetchUsdRate();
setInterval(fetchUsdRate, 30 * 60 * 1000);
</script>
</body>
